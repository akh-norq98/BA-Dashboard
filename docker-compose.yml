services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deliveryhub
      POSTGRES_USER: deliveryhub
      POSTGRES_PASSWORD: deliveryhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://deliveryhub:deliveryhub@db:5432/deliveryhub
      APP_ENV: ${APP_ENV:-production}
      DELIVERY_HUB_JWT_SECRET: ${DELIVERY_HUB_JWT_SECRET:-change-this-delivery-hub-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.example.com,http://localhost:3000}
    depends_on:
      - db
    expose:
      - "8000"
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com/api}
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    expose:
      - "3000"
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-replace-with-cloudflare-tunnel-token}
    depends_on:
      - frontend
      - backend
volumes:
  postgres_data:
